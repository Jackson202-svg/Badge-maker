<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Badge Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Badge Maker</h2>
    
    <div class="form-container">
        <div class="input-group">
            <label for="label">Label (Left Text)</label>
            <input type="text" id="label" placeholder="e.g. style" value="style">
        </div>

        <div class="input-group">
            <label for="message">Message (Right Text)</label>
            <input type="text" id="message" placeholder="e.g. flat" value="flat">
        </div>

        <div class="input-group">
            <label for="logo">Logo (SimpleIcons name)</label>
            <input type="text" id="logo" placeholder="e.g. github, react">
        </div>

        <div class="input-group">
            <label for="color">Color</label>
            <input type="color" id="color" value="#238636">
        </div>

        <div class="input-group">
            <label for="style">Style</label>
            <select id="style">
                <option value="flat">Flat</option>
                <option value="flat-square">Flat Square</option>
                <option value="for-the-badge">For the Badge</option>
                <option value="plastic">Plastic</option>
                <option value="social">Social</option>
            </select>
        </div>
    </div>

    <div class="preview-box">
        <img id="badge-preview" src="" alt="Badge Preview">
        <div class="code-display" id="code-output">Generating...</div>
        <button id="copy-btn">Copy Markdown</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
